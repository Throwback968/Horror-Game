<!DOCTYPE html>

<!-- setting default language -->
<html lang = "en">

    <!-- not visible -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="indexStyle.css">

    <title>My Web Page</title>
</head>

    <!-- Visible content -->
<div id = "Header">
    <h1>My Story Game</h1>
</div>

<image src="27352456687_17f4c0ffe7_b.jpg" muted loop autoplay id="myVideo"></image>

<div class="menuContainer">

    <div id="startScreen">
        <h1>Story Time!</h1>
        <button id="startBtn">Start Story</button>
    </div>

    <div id="nameScreen" style="display:none;">
        <h1>What's your name?</h1>
        <input id="nameInput">
        <button id="submitBtn">Enter</button>
    </div>

    <div id="introductionScreen" style="display:none;">
        <h1 id="storyTitle">Welcome</h1>
        <p id="storyText"></p>
        <button id="continueBtn">Enter</button>
    </div>

    <div id="prologueScreen" style="display:none;">
        <h1 id="prologue">And so it begins...</h1>
        <p id="prologueText"></p>
        <button id="choiceOne"></button>
        <button id="choiceTwo"></button>
    </div>

    <button id="homeBtn">Home</button>

</div>

</html>

<script src="theMagic.js"></script>
